{% extends "base.html" %}
{% set active_page = 'profile' %}
{% block title %}My Profile{% endblock %}
{% block content %}

<div class="topbar">
    <div>
        <div class="page-title">My Profile</div>
        <div class="page-subtitle">Manage your account details and password.</div>
    </div>
</div>

<div class="card-agende" style="max-width: 500px;">
    <form method="POST" action="{{ url_for('user_profile') }}">
        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" name="name" value="{{ user.name }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-control" value="{{ user.email }}" disabled>
            <div class="form-text">Email cannot be changed.</div>
        </div>
        <div class="mb-3">
            <label class="form-label">Phone Number</label>
            <input type="text" class="form-control" name="phone" value="{{ user.phone or '' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">New Password</label>
            <input type="password" class="form-control" name="new_password" placeholder="Leave blank to keep current password">
        </div>
        <button type="submit" class="btn btn-agende w-100">Save Changes</button>
    </form>
</div>

{% endblock %}
